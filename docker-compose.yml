version: "3.8"

services:
  # Loki - 로그 저장소
  loki:
    image: grafana/loki:2.9.0
    container_name: loki
    ports:
      - "3100:3100"
    environment:
      - TZ=Asia/Seoul
    volumes:
      - ./loki-config.yml:/etc/loki/local-config.yaml
      - loki-data:/loki
    command: -config.file=/etc/loki/local-config.yaml
    networks:
      - loki-network

  # Grafana Alloy - 로그 및 메트릭 수집 (Promtail 대체)
  alloy:
    image: grafana/alloy:latest
    container_name: alloy
    ports:
      - "12345:12345" # Alloy 자체 대시보드 (설정 디버깅용)
    environment:
      - TZ=Asia/Seoul
    volumes:
      - ./alloy-config.yml:/etc/alloy/config.alloy # 생성하신 alloy 설정 파일 매핑
      - ./logs:/var/log/spring-boot               # Spring 로그 파일 경로
      - /var/run/docker.sock:/var/run/docker.sock # 도커 소켓 (필요 시)
    # 실행 명령어: 설정을 체크하고 실행하도록 run 명령어를 사용합니다.
    command: run --server.http.listen-addr=0.0.0.0:12345 --storage.path=/var/lib/alloy/data /etc/alloy/config.alloy
    depends_on:
      - loki
    networks:
      - loki-network

  # Grafana - 시각화 대시보드
  grafana:
    image: grafana/grafana:10.1.0
    container_name: grafana
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_USERS_ALLOW_SIGN_UP=false
      - TZ=Asia/Seoul
    volumes:
      - grafana-data:/var/lib/grafana
    depends_on:
      - loki
    networks:
      - loki-network

  prometheus:
    image: prom/prometheus:latest
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus-config.yml:/etc/prometheus/prometheus.yml
    networks:
      - loki-network

networks:
  loki-network:
    driver: bridge

volumes:
  loki-data:
  grafana-data: