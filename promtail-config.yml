server:
  http_listen_port: 9080
  grpc_listen_port: 0

positions:
  filename: /tmp/positions.yaml

clients:
  - url: http://loki:3100/loki/api/v1/push

scrape_configs:
  - job_name: spring-boot
    static_configs:
      - targets:
          - localhost
        labels:
          job: spring-boot
          app: log-demo
          __path__: /var/log/spring-boot/*.log

    # 로그 파싱 파이프라인
    pipeline_stages:
      # 타임스탬프 추출
      - regex:
          expression: '^(?P<timestamp>\d{4}-\d{2}-\d{2} \d{2}:\d{2}:\d{2}\.\d{3})'

      # 로그 레벨 추출
      - regex:
          expression: '\[.*?\]\s+(?P<level>(TRACE|DEBUG|INFO|WARN|ERROR))'

      # 레이블 추가
      - labels:
          level:

      # 타임스탬프 파싱
      - timestamp:
          source: timestamp
          format: '2006-01-02 15:04:05.000'
          location: "Asia/Seoul"

      # 출력 포맷 설정
      - output:
          source: message